name: Deploy Azure Functions to Azure

on:
  push:
    # branches:
    #   - main  # Trigger deployment on push to 'main' branch
    paths:
      - 'azure-html-search/**'  # Trigger only when changes occur in the app1 directory
      - '.github/workflows/Ai-Search-Pipeline.yml'


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # pip install -r requirements.txt
          pip install -r azure-html-search/requirements.txt

      # Step 4: Set up Azure CLI
      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 5: Create Azure Resources (Optional: Skip if already created)
      - name: Create Azure Function App Resources
        run: |
          # az appservice plan create \
            # --name ${{ secrets.APP_SERVICE_PLAN }} \
            # --name "Ai-Search-Plan" \
            # --resource-group ${{ secrets.RESOURCE_GROUP }} \
            # --resource-group "pipeline-deployment" \
            # --location eastus \
            # --sku B1 \
            # --is-linux
          az appservice plan create --resource-group pipeline-deployment --name Ai-Search-Plan  --sku B1 --is-linux
          az functionapp create --name azure-html-search --storage-account aisearchstorageacct --resource-group pipeline-deployment --plan Ai-Search-Plan --runtime python --runtime-version 3.9 --functions-version 4 --os-type linux

    #       az functionapp create \
    #         --name ${{ secrets.FUNCTION_APP_NAME }} \
    #         --storage-account ${{ secrets.STORAGE_ACCOUNT }} \
    #         --resource-group ${{ secrets.RESOURCE_GROUP }} \
    #         --plan ${{ secrets.APP_SERVICE_PLAN }} \
    #         --runtime python \
    #         --runtime-version 3.9 \
    #         --functions-version 4 \
    #         --os-type linux

      # Step 6: Set Environment Variables
      - name: Configure App Settings
        run: |
          # az functionapp config appsettings set \
            # --name ${{ secrets.FUNCTION_APP_NAME }} \
            # --resource-group ${{ secrets.RESOURCE_GROUP }} \
            # --settings \
            # AzureWebJobsStorage=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }} \
            # FUNCTIONS_WORKER_RUNTIME="python" \
            # SEARCH_SERVICE_ENDPOINT="${{ secrets.SEARCH_SERVICE_ENDPOINT }}" \
            # SEARCH_SERVICE_API_KEY="${{ secrets.SEARCH_SERVICE_API_KEY }}" \
            # SEARCH_INDEX_NAME="${{ secrets.SEARCH_INDEX_NAME }}" \
            # SECONDARY_SEARCH_INDEX_NAME="${{ secrets.SECONDARY_SEARCH_INDEX_NAME }}" \
            # OPENAI_ENDPOINT="${{ secrets.OPENAI_ENDPOINT }}" \
            # OPENAI_KEY="${{ secrets.OPENAI_KEY }}"
          az functionapp config appsettings set --name azure-html-search --resource-group pipeline-deployment --settings AzureWebJobsStorage= "DefaultEndpointsProtocol=https;AccountName=aisearchstorageacct;AccountKey=tJJV5DqccwZXhamY65b4+H7PTlIJT+82MqbSg2Rvn6T+J7OPT4HQG9FBVzLqNRRYL/hEnDNZcesh+AStzecSgg==;EndpointSuffix=core.windows.net" FUNCTIONS_WORKER_RUNTIME="python" SEARCH_SERVICE_ENDPOINT="https://gptkb-kf5c5wgrhtage.search.windows.net" SEARCH_SERVICE_API_KEY="3zMUbBwoeNOtU1LIuoP9vFou0PTMwv1L3HcAm5JvS1AzSeA4he0q" SEARCH_INDEX_NAME="html-dev-index-updated" SECONDARY_SEARCH_INDEX_NAME="pdf-html" OPENAI_ENDPOINT="https://sementickernal1627560484.openai.azure.com/" OPENAI_KEY="7669d8794eb64532807d8a573d4fbcfc"

      # Step 7: Deploy Function App
      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          # app-name: ${{ secrets.FUNCTION_APP_NAME }}
          app-name: "azure-html-search"
          # package: .
          package: './azure-html-search'  # Path to the API 2 code
          # publish-profile: ${{ secrets.FUNCTION_APP_PUBLISH_PROFILE }}
          publish-profile: <publishData><publishProfile profileName="azure-html-search - Web Deploy" publishMethod="MSDeploy" publishUrl="azure-html-search.scm.azurewebsites.net:443" msdeploySite="azure-html-search" userName="$azure-html-search" userPWD="aj5wS3rnSobsSPeiy7g6l2DXT3pchQutgSSLNk07Kuf9rhPhFEP48Qtgsgxt" destinationAppUrl="http://azure-html-search.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile><publishProfile profileName="azure-html-search - FTP" publishMethod="FTP" publishUrl="ftps://waws-prod-blu-533.ftp.azurewebsites.windows.net/site/wwwroot" ftpPassiveMode="True" userName="azure-html-search\$azure-html-search" userPWD="aj5wS3rnSobsSPeiy7g6l2DXT3pchQutgSSLNk07Kuf9rhPhFEP48Qtgsgxt" destinationAppUrl="http://azure-html-search.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile><publishProfile profileName="azure-html-search - Zip Deploy" publishMethod="ZipDeploy" publishUrl="azure-html-search.scm.azurewebsites.net:443" userName="$azure-html-search" userPWD="aj5wS3rnSobsSPeiy7g6l2DXT3pchQutgSSLNk07Kuf9rhPhFEP48Qtgsgxt" destinationAppUrl="http://azure-html-search.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile></publishData>

      - name: Debug List Files
        run: |
          ls -l ./azure-html-search
          zip -T ./azure-html-search.zip
        

      # Step 8: Integrate with API Management (Add API Operation and Inbound Policy)
      - name: Configure API Management
        run: |
          # Create a new API operation
          az apim api operation create \
            # --service-name ${{ secrets.API_MANAGEMENT_SERVICE_NAME }} \
            --service-name "Ai-Search-AMS" \
            --api-id "search-api" \
            --operation-id "search-operation" \
            --method POST \
            --url-template "/search" \
            --response-status 200 \
            --response-description "Search Results" \
            --request-description "Search request" \
            --request-body "application/json" \
            --service-url "https://azure-html-search.azurewebsites.net/api/search"

      # Step 9: Verify Deployment
      - name: Test Deployment
        run: |
          echo "Deployment successful!"
          # az functionapp show --name ${{ secrets.FUNCTION_APP_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP }}
          az functionapp show --name azure-html-search --resource-group pipeline-deployment
