      - name: Get Subscription ID Dynamically
        id: get-subscription-id
        run: |
          # Get the current subscription information
          SUBSCRIPTION_ID=$(az account list --query "[?state=='Enabled'].id" -o tsv)
          echo "Current Subscription ID: $SUBSCRIPTION_ID"
          
          # Output the subscription ID for later use in other steps
          echo "::set-output name=subscription-id::$SUBSCRIPTION_ID"

      - name: Set Azure Access Token
        id: azure_token
        run: |
          echo "##[set-output name=token;]$(az account get-access-token --query accessToken --output tsv)"
        
      - name: Store Access Token
        run: |
          echo "AZURE_ACCESS_TOKEN=${{ steps.azure_token.outputs.token }}" >> $GITHUB_ENV

      # Step 8: Integrate with API Management (Add API Operation and Inbound Policy)
      - name: Configure API Management
        run: |
          curl -X POST \
            "https://management.azure.com/subscriptions/${{ steps.get-subscription-id.outputs.subscription-id }}/resourceGroups/pipeline-deployment/providers/Microsoft.ApiManagement/service/Ai-Search-AMS/apis/search-api/operations/search-api/policy?api-version=2023-03-01-preview" \
            -H "Authorization: Bearer ${{ steps.azure_token.outputs.token }}" \
            -H "Content-Type: application/json" \
            --data-raw '{
              "properties": {
                "inbound": {
                  "base": {},
                  "set-backend-service": {
                    "base-url": "https://uat1-html-search-api.azurewebsites.net/api"
                  },
                  "set-method": "POST",
                  "rewrite-uri": {
                    "template": "/search"
                  },
                  "set-header": {
                    "name": "Content-Type",
                    "exists-action": "override",
                    "value": "application/json"
                  }
                },
                "backend": {
                  "base": {}
                },
                "outbound": {
                  "base": {}
                },
                "on-error": {
                  "base": {}
                }
              }
            }'

