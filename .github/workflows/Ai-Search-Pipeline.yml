name: Deploy Azure Functions to Azure

on:
  push:
    paths:
      # - 'azure-html-search/**'
      # - 'azure-pdf-search/**'
      - '.github/workflows/Ai-Search-Pipeline.yml'

jobs:
  filter:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Determine Changed Paths
      - name: Determine Changed Paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            azure-html-search:
              - 'azure-html-search/**'
            azure-pdf-search:
              - 'azure-pdf-search/**'

  deploy:
    needs: filter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - name: azure-html-search
            plan: Search-Plan-html-search-v1
            resource_group: pipeline-deployment
            functionapp: azure-html-search-api-v1
            requirements: azure-html-search/requirements.txt
            storage_account: searchstorageacctv1
            search_service_endpoint: "https://gptkb-kf5c5wgrhtage.search.windows.net"
            search_service_api_key: "3zMUbBwoeNOtU1LIuoP9vFou0PTMwv1L3HcAm5JvS1AzSeA4he0q"
            search_index_name: "html-dev-index-updated"
            secondary_search_index_name: "pdf-html"
            openai_endpoint: "https://sementickernal1627560484.openai.azure.com/"
            openai_key: "7669d8794eb64532807d8a573d4fbcfc"
            api_management_name: Ai-Search-AMS-v1
            api_id: search-api
            operation_id: ai-search-operation
            operation_display_name: "AI Search Operation"
            operation_description: "Operation to execute AI search queries"
          
          # Disable second project for testing
          # - name: azure-pdf-search
          #   plan: Ai-Search-Plan-azure-pdf-search
            # resource_group: pipeline-deployment
          #   functionapp: azure-pdf-search
          #   requirements: azure-pdf-search/requirements.txt
          #   storage_account: ${{ matrix.project.storage_account}}
          #   search_service_endpoint: "https://gptkb-kf5c5wgrhtage.search.windows.net"
          #   search_service_api_key: "3zMUbBwoeNOtU1LIuoP9vFou0PTMwv1L3HcAm5JvS1AzSeA4he0q"
          #   search_index_name: "pdf-dev-index-updated"
          #   secondary_search_index_name: "html-pdf"
          #   openai_endpoint: "https://sementickernal1627560484.openai.azure.com/"
          #   openai_key: "7669d8794eb64532807d8a573d4fbcfc"
          #   api_management_name: Ai-Search-AMS
          #   api_id: search-api
          #   operation_id: search-operation
          #   operation_display_name: "Search Operation"
          #   operation_description: "Operation to execute search queries"
    env:
      AZURE_FUNCTIONAPP_PACKAGE_PATH: './${{ matrix.project.name }}'

    # Run only if the first project (`azure-html-search`) is modified
    # if: needs.filter.outputs.azure-html-search == 'true'

    # # Run only if the corresponding project is modified
    # if: |
    #   (matrix.project.name == 'azure-html-search' && steps.filter.outputs.azure-html-search == 'true') ||
    #   (matrix.project.name == 'azure-pdf-search' && steps.filter.outputs.azure-pdf-search == 'true')

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Create and start virtual environment
        run: |
          cd ${{ matrix.project.name }}
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          cd ${{ matrix.project.name }}
          pip install -r requirements.txt

      - name: Zip artifact for deployment
        run: |
          cd ${{ matrix.project.name }}
          zip release.zip ./* -r

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v3
        with:
          name: python-app-${{ matrix.project.name }}
          path: |
            ${{ matrix.project.name }}/release.zip
            !${{ matrix.project.name }}/venv/

      # # Step 3: Install Dependencies
      # - name: Install Dependencies
      #   run: |
      #     python -m venv .venv
      #     source .venv/bin/activate
      #     pip install -r ${{ matrix.project.requirements }}

      # - name: Debug List Files
      #   run: |
      #     ls -l ./azure-html-search

      # - name: Create ZIP File
      #   run: |
      #     zip -r ./azure-html-search.zip ./azure-html-search

      - name: Debug Workflow Environment
        run: |
          pwd
          ls -l

      # Step 4: Set up Azure CLI
      - name: Set up Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az --version

      # Step 5: Azure Login
      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 6: Create the storage account (if not already created)
      - name: Create Storage Account (if not already created)
        run: |
          az storage account create --name ${{ matrix.project.storage_account }} --resource-group ${{ matrix.project.resource_group}} --location eastus --sku Standard_LRS

      - name: Retrieve Azure Storage Connection String
        id: storage-connection
        run: |
          CONNECTION_STRING=$(az storage account show-connection-string \
            --name ${{ matrix.project.storage_account }} \
            --resource-group ${{ matrix.project.resource_group }} \
            --query connectionString \
            --output tsv)
          echo "AzureWebJobsStorage=$CONNECTION_STRING" >> $GITHUB_ENV
          # echo "Environment Variable: ${{ env.AzureWebJobsStorage }}"
          echo "Environment Variable:"
          echo "AzureWebJobsStorage=$CONNECTION_STRING"
        shell: bash

      # Step 7: Create Azure Resources
      - name: Create Azure Function App Resources
        run: |
          az appservice plan create --resource-group ${{ matrix.project.resource_group}} --name ${{ matrix.project.plan }} --sku B1 --is-linux
          az functionapp create --name ${{ matrix.project.functionapp }} --storage-account ${{ matrix.project.storage_account}} --resource-group ${{ matrix.project.resource_group}} --plan ${{ matrix.project.plan }} --runtime python --runtime-version 3.9 --functions-version 4 --os-type linux

      # Step 8: Configure App Settings (Environment Variables)
      - name: Configure App Settings
        run: |
          az functionapp config appsettings set \
            --name ${{ matrix.project.functionapp }} \
            --resource-group pipeline-deployment \
            --settings \
            AzureWebJobsStorage="${{ env.AzureWebJobsStorage }}" \
            FUNCTIONS_WORKER_RUNTIME="python" \
            SEARCH_SERVICE_ENDPOINT="${{ matrix.project.search_service_endpoint }}" \
            SEARCH_SERVICE_API_KEY="${{ matrix.project.search_service_api_key }}" \
            SEARCH_INDEX_NAME="${{ matrix.project.search_index_name }}" \
            SECONDARY_SEARCH_INDEX_NAME="${{ matrix.project.secondary_search_index_name }}" \
            OPENAI_ENDPOINT="${{ matrix.project.openai_endpoint }}" \
            OPENAI_KEY="${{ matrix.project.openai_key }}"

      # Step 9: Deploy to Azure Function App
      # - name: Deploy API 1 to Azure Function App
      #   uses: azure/webapps-deploy@v2
      #   with:
      #     app-name: 'your-function-app-1-name'  # Replace with your first Function App name
      #     publish-profile: ${{ secrets.FUNCTION_APP_1_PUBLISH_PROFILE }}
      #     package: '.'  # The folder containing the API code
          
      # # OR Using Azure Functions Action (you can choose the appropriate method)
      # - name: Deploy to Azure Function App
      #   uses: Azure/functions-action@v1
      #   with:
      #     app-name: "${{ matrix.project.functionapp }}"
      #     # package: './${{ matrix.project.name }}.zip'
      #     # package: './azure-html-search.zip'
      #     package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}          # OR Using az CLI (uncomment to use this method)
      #     # az functionapp deployment source config-zip --name ${{ matrix.project.functionapp }} --resource-group ${{ matrix.project.resource_group}} --src-path ./${{ matrix.project.name }}.zip

      # Step 7: Download artifact for deployment
      - name: Download artifact for deployment
        uses: actions/download-artifact@v3
        with:
          name: python-app-${{ matrix.project.name }}
          path: ./downloaded_artifacts

      - name: Check current directory and list files
        run: |
          pwd
          ls -R

      - name: Check if directory exists
        run: |
          ls -l ./downloaded_artifacts/
          ls -d ./downloaded_artifacts/azure-html-search
                
      # Step 8: Unzip the downloaded artifact
      - name: Unzip downloaded artifact
        run: |
          cd ./downloaded_artifacts/${{ matrix.project.name }}
          unzip release.zip -d ./

      # Step 9: Deploy to Azure Function App
      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: "${{ matrix.project.functionapp }}"
          package: ./downloaded_artifacts/${{ matrix.project.name }}

      # Step 10: Integrate with API Management (Add API Operation and Inbound Policy)
      - name: Configure API Management
        run: |
          az apim create --name ${{ matrix.project.api_management_name }} --resource-group pipeline-deployment --location eastus --publisher-email nshafiq@prudenttechnology.com --publisher-name Microsoft
          az apim show --name ${{ matrix.project.api_management_name }} --resource-group pipeline-deployment
          # Create the API if it doesn't exist
          az apim api create --resource-group pipeline-deployment --service-name ${{ matrix.project.api_management_name }} --api-id ${{ matrix.project.api_id }}  --display-name ${{ matrix.project.api_id }} --path "search" --protocols https

          az apim api list --resource-group pipeline-deployment --service-name Ai-Search-AMS-api
          az apim api operation create --resource-group pipeline-deployment --service-name ${{ matrix.project.api_management_name }} --api-id ${{ matrix.project.api_id }} --url-template "/search" --method POST --display-name "${{ matrix.project.operation_display_name }}" --operation-id "${{ matrix.project.operation_id }}" --description "${{ matrix.project.operation_description }}"

      # Step 11: Get Subscription ID Dynamically
      - name: Get Subscription ID Dynamically
        id: get-subscription-id
        run: |
          SUBSCRIPTION_ID=$(az account list --query "[?state=='Enabled'].id" -o tsv)
          echo "Current Subscription ID: $SUBSCRIPTION_ID"
          echo "::set-output name=subscription-id::$SUBSCRIPTION_ID"

      # Step 12: Set Azure Access Token
      - name: Set Azure Access Token
        id: azure_token
        run: |
          echo "##[set-output name=token;]$(az account get-access-token --query accessToken --output tsv)"

      # Step 13: Store Access Token
      - name: Store Access Token
        run: |
          echo "AZURE_ACCESS_TOKEN=${{ steps.azure_token.outputs.token }}" >> $GITHUB_ENV

      # Step 14: Integrate with API Management
      - name: Configure API Management
        run: |
          curl -X PUT \
            "https://management.azure.com/subscriptions/${{ steps.get-subscription-id.outputs.subscription-id }}/resourceGroups/${{ matrix.project.resource_group}}/providers/Microsoft.ApiManagement/service/Ai-Search-AMS/apis/search-api/operations/search-api/policy?api-version=2023-03-01-preview" \
            -H "Authorization: Bearer ${{ steps.azure_token.outputs.token }}" \
            -H "Content-Type: application/json" \
            --data-raw '{
              "properties": {
                "policyContent": "<policies><inbound><set-backend-service base-url=\"https://uat1-html-search-api.azurewebsites.net/api\" /><rewrite-uri template=\"/search\" /><set-method>POST</set-method><set-header name=\"Content-Type\" exists-action=\"override\"><value>application/json</value></set-header></inbound><backend /><outbound /><on-error /></policies>"
              }
            }'

      # Step 15: Test Deployment
      - name: Test Deployment
        run: |
          echo "Deployment successful!"
          az functionapp show --name ${{ matrix.project.functionapp }} --resource-group ${{ matrix.project.resource_group}}