name: Deploy Azure Functions to Azure

on:
  push:
    # branches:
    #   - main  # Trigger deployment on push to 'main' branch
    paths:
      - 'azure-html-search/**'  # Trigger only when changes occur in the app1 directory
      - '.github/workflows/Ai-Search-Pipeline.yml'


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # pip install -r requirements.txt
          pip install -r azure-html-search/requirements.txt

      - name: Debug List Files
        run: |
          ls -l ./azure-html-search

      - name: Create ZIP File
        run: |
          zip -r ./azure-html-search.zip ./azure-html-search
                            
      - name: Debug Workflow Environment
        run: |
          pwd
          ls -l
        
      # Step 4: Set up Azure CLI
      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 5: Create Azure Resources (Optional: Skip if already created)
      - name: Create Azure Function App Resources
        run: |
          az appservice plan create --resource-group pipeline-deployment --name Ai-Search-Plan  --sku B1 --is-linux
          az functionapp create --name azure-html-search --storage-account aisearchstorageacct --resource-group pipeline-deployment --plan Ai-Search-Plan --runtime python --runtime-version 3.9 --functions-version 4 --os-type linux


      # Step 6: Set Environment Variables
      - name: Configure App Settings
        run: |
          az functionapp config appsettings set --name azure-html-search --resource-group pipeline-deployment --settings AzureWebJobsStorage= "DefaultEndpointsProtocol=https;AccountName=aisearchstorageacct;AccountKey=tJJV5DqccwZXhamY65b4+H7PTlIJT+82MqbSg2Rvn6T+J7OPT4HQG9FBVzLqNRRYL/hEnDNZcesh+AStzecSgg==;EndpointSuffix=core.windows.net" FUNCTIONS_WORKER_RUNTIME="python" SEARCH_SERVICE_ENDPOINT="https://gptkb-kf5c5wgrhtage.search.windows.net" SEARCH_SERVICE_API_KEY="3zMUbBwoeNOtU1LIuoP9vFou0PTMwv1L3HcAm5JvS1AzSeA4he0q" SEARCH_INDEX_NAME="html-dev-index-updated" SECONDARY_SEARCH_INDEX_NAME="pdf-html" OPENAI_ENDPOINT="https://sementickernal1627560484.openai.azure.com/" OPENAI_KEY="7669d8794eb64532807d8a573d4fbcfc"


      # Step 8: Integrate with API Management (Add API Operation and Inbound Policy)
      - name: Configure API Management
        run: |
         
          # Create API Management service if it doesn't exist
          az apim create --name Ai-Search-AMS -g pipeline-deployment -l eastus --publisher-email nshafiq@prudenttechnology.com --publisher-name Microsoft

          # Show to the created API
          az apim show --name Ai-Search-AMS --resource-group pipeline-deployment

          # Create the API if it doesn't exist
          az apim api create --resource-group pipeline-deployment --service-name Ai-Search-AMS --api-id search-api  --display-name "Search API" --path "search" --protocols https
          
          # Add operation to the created API
          az apim api operation create --resource-group pipeline-deployment --service-name "Ai-Search-AMS" --api-id "search-api" --url-template "/search" --method POST --display-name "Search Operation" --operation-id "search-operation" --description "Operation to execute search queries"
          

      # Step 8: Integrate with API Management (Add API Operation and Inbound Policy)
      - name: Configure API Management with PowerShell
        run: |
          # Authenticate with Azure using the credentials from Azure login
          # The following cmdlet should work directly after the Azure CLI login
          # Install-Module -Name Az.ApiManagement -Force -AllowClobber
          Install-Module -Name Az.ApiManagement -Force -AllowClobber -Scope CurrentUser

          # Authenticate with Azure
          $Connection = Connect-AzAccount -Identity

          Set-AzApiManagementPolicy -ResourceGroupName "pipeline-deployment" `
                                     -ServiceName "Ai-Search-AMS" `
                                     -ApiId "search-api" `
                                    #  -OperationId "search-operation" `
                                     -PolicyContent @"
          <policies>
              <inbound>
                  <base />
                  <set-backend-service base-url="https://uat1-html-search-api.azurewebsites.net/api" />
                  <set-method>POST</set-method>
                  <rewrite-uri template="/search" />
                  <set-header name="Content-Type" exists-action="override">
                      <value>application/json</value>
                  </set-header>
              </inbound>
              <backend>
                  <base />
              </backend>
              <outbound>
                  <base />
              </outbound>
              <on-error>
                  <base />
              </on-error>
          </policies>
          "@
        shell: pwsh

      # Step 9: Verify Deployment
      - name: Test Deployment
        run: |
          echo "Deployment successful!"
          az functionapp show --name azure-html-search --resource-group pipeline-deployment
